<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — Fil Bleu Box</title>
    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182b3a; background: #f2f6f8; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 420px); padding: 34px; border: 1px solid #dce6eb; border-radius: 18px; background: #fff; box-shadow: 0 18px 48px #16354a12; }
        .brand { display: flex; align-items: center; gap: 10px; color: #155b80; font-weight: 750; }
        .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; color: #fff; background: #087eaa; }
        h1 { margin: 28px 0 8px; font-size: 1.65rem; }
        p { margin: 0 0 24px; color: #637785; line-height: 1.5; }
        label { display: block; margin: 16px 0 7px; font-size: .9rem; font-weight: 650; }
        input { width: 100%; padding: 12px 13px; border: 1px solid #c8d6de; border-radius: 9px; font: inherit; }
        input:focus { outline: 3px solid #1a8ab529; border-color: #1683aa; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 9px; color: #fff; background: #087eaa; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #066b91; }
        .visualization-button { margin-top: 10px; border: 1px solid #c8d6de; color: #31566b; background: #fff; }
        .visualization-button:hover { background: #f2f6f8; }
        .message { margin-top: 18px; padding: 11px 12px; border-radius: 8px; background: #fff1ed; color: #a13b25; font-size: .9rem; }
        .message.success { background: #eaf7ef; color: #23673b; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><span>Fil Bleu Box</span></div>
        <h1>Espace d’administration</h1>
        <p>Connectez-vous pour consulter le réseau ou gérer les appareils.</p>
        <form th:action="@{/login}" method="post">
            <label for="username">Identifiant</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Se connecter</button>
        </form>
        <form th:action="@{/visualisation}" method="get">
            <button class="visualization-button" type="submit">Visualisation</button>
        </form>
        <div class="message" th:if="${param.error}">Identifiant ou mot de passe incorrect.</div>
        <div class="message success" th:if="${param.logout}">Vous êtes déconnecté.</div>
    </main>
</body>
</html>
